<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הדגמת Controller CRM</title>
<script src="../demo-analytics.js"></script>
<meta name="robots" content="noindex, follow">
<meta name="description" content="הדגמה חיה של מערכת CRM: פתיחת פנייה, תיעוד, תזכורת, SMS ללקוח, חריגות ודשבורד מנהל. הכל מדומה.">
<link rel="icon" href="logo.webp">
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap');

:root {
  --bg: #eef0f5;
  --bg2: #f8f9fc;
  --bg3: #f1f3f8;
  --bg4: #e8ebf2;
  --bg-card: #ffffff;
  --border: #dde1eb;
  --border2: #c8cedd;
  --text: #111827;
  --text2: #4b5568;
  --text3: #9ca3af;
  --accent: #2563eb;
  --accent-lt: #eff4ff;
  --accent-dk: #1d4ed8;
  --green: #15803d; --green-lt: #f0fdf4;
  --amber: #b45309; --amber-lt: #fffbeb;
  --red: #b91c1c;   --red-lt: #fef2f2;
  --purple: #6d28d9;--purple-lt: #f5f3ff;
  --teal: #0f766e;  --teal-lt: #f0fdfa;
  --radius: 12px; --radius-sm: 8px; --radius-xs: 5px; --radius-lg: 16px;
  --shadow-xs: 0 1px 2px rgba(15,23,42,0.04);
  --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 2px 8px rgba(15,23,42,0.04);
  --shadow: 0 2px 8px rgba(15,23,42,0.07), 0 8px 24px rgba(15,23,42,0.05);
  --shadow-lg: 0 8px 32px rgba(15,23,42,0.12), 0 2px 8px rgba(15,23,42,0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; direction: rtl; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* Topbar */
.topbar {
  height: 58px;
  /* White-label: a company with brand_topbar='brand' overrides --topbar-1/2/3 (set in Topbar.tsx
     from its brand accent). The fallbacks are the exact current navy, so any company WITHOUT
     brand-topbar renders identically to before — this change is purely additive. */
  background: linear-gradient(135deg, var(--topbar-1,#172e6e) 0%, var(--topbar-2,#1e40af) 55%, var(--topbar-3,#2563eb) 100%);
  display: flex; align-items: center; padding: 0 20px; gap: 1px; flex-shrink: 0;
  box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 2px 14px rgba(23,46,110,0.35);
  position: sticky; top: 0; z-index: 50;
}
.topbar-brand { font-size: 16px; font-weight: 800; color: #fff; margin-left: 8px; padding-left: 14px; border-left: 1px solid rgba(255,255,255,0.16); display: flex; align-items: center; gap: 8px; letter-spacing: 0.3px; flex-shrink: 0; }
.brand-dot { width: 8px; height: 8px; border-radius: 50%; background: #93c5fd; box-shadow: 0 0 6px #93c5fd; }
/* Nav items live in a flexible strip that scrolls horizontally if they don't fit,
   so the pinned controls (search / user / logout) are ALWAYS visible. */
.topbar-nav { display: flex; align-items: center; gap: 1px; flex: 1 1 auto; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 0 4px; }
.topbar-nav::-webkit-scrollbar { display: none; }
.nav-btn { flex-shrink: 0; padding: 6px 9px; border-radius: 8px; border: none; background: transparent; color: rgba(255,255,255,0.74); cursor: pointer; font-family: 'Heebo', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.2px; transition: background 0.15s, color 0.15s; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; white-space: nowrap; }
.nav-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
.nav-btn.active { background: rgba(255,255,255,0.17); color: #fff; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
.topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.user-pill { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 7px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); border-radius: 999px; }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg,#60a5fa,#a78bfa); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.user-name { font-size: 12px; font-weight: 600; color: #fff; }
.user-role { font-size: 11px; color: rgba(255,255,255,0.65); }
/* Co-brand bar (opt-in): only rendered when a company has a SECOND logo (companies.brand_logo2_key).
   A light bar so both partner logos keep their real colours; every other company is untouched. */
.topbar.cobrand { background: #fff; box-shadow: 0 1px 0 #e2e7f3, 0 6px 22px rgba(11,18,48,0.06); gap: 14px; }
.topbar.cobrand::after { content: ""; position: absolute; inset: auto 0 0 0; height: 3px; background: linear-gradient(90deg, var(--accent-dk), var(--accent)); }
.topbar.cobrand .topbar-brand { margin: 0; padding: 0 0 0 16px; border: 0; border-left: 1px solid #e2e7f3; height: 40px; }
.topbar.cobrand .cobrand-logo1 { height: 40px; width: auto; display: block; }
.topbar.cobrand .cobrand-logo2 { flex-shrink: 0; height: 40px; display: flex; align-items: center; border-right: 1px solid #e2e7f3; padding-right: 16px; }
.topbar.cobrand .cobrand-logo2 img { height: 28px; width: auto; display: block; }
.topbar.cobrand .nav-btn { color: #4a5472; }
.topbar.cobrand .nav-btn:hover { background: #f1f4fc; color: #0b1230; }
.topbar.cobrand .nav-btn.active { background: var(--accent-lt); color: var(--accent-dk); box-shadow: none; }
.topbar.cobrand .user-pill { background: #f4f6fc; border-color: #e2e7f3; }
.topbar.cobrand .user-name { color: #0b1230; }
.topbar.cobrand .user-role { color: #8a93ad; }
.topbar.cobrand .topbar-right input[placeholder*="חיפוש"] { background: #f4f6fc !important; border-color: #e2e7f3 !important; color: #0b1230 !important; }
.topbar.cobrand .topbar-right input::placeholder { color: #8a93ad !important; }
.topbar.cobrand .btn-white { border-color: #d6dcee; color: #0b1230; }
@media (max-width: 760px) { .topbar.cobrand .cobrand-logo1 { height: 32px; } .topbar.cobrand .cobrand-logo2 img { height: 22px; } .topbar.cobrand .cobrand-logo2 { padding-right: 8px; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--bg-card); color: var(--text); cursor: pointer; font-family: 'Heebo', sans-serif; font-size: 13px; font-weight: 500; transition: all 0.15s; white-space: nowrap; box-shadow: var(--shadow-xs); text-decoration: none; }
.btn:hover { background: var(--bg3); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.btn:active { transform: scale(0.98); }
.btn-primary { background: linear-gradient(135deg,#2563eb,#1d4ed8); border-color: #1d4ed8; color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,0.3); }
.btn-primary:hover { background: linear-gradient(135deg,#1d4ed8,#1e40af); box-shadow: 0 4px 14px rgba(37,99,235,0.4); color: #fff; }
.btn-success { background: linear-gradient(135deg,#16a34a,#15803d); border-color: #15803d; color: #fff; box-shadow: 0 2px 8px rgba(21,128,61,0.25); }
.btn-success:hover { background: linear-gradient(135deg,#15803d,#166534); color: #fff; }
.btn-danger { background: var(--red-lt); border-color: #fca5a5; color: var(--red); }
.btn-danger:hover { background: #fee2e2; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-xs { padding: 3px 9px; font-size: 11px; }
.btn-white { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.25); color: #fff; }
.btn-white:hover { background: rgba(255,255,255,0.25); color: #fff; }

/* Form */
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px; }
.form-input { width: 100%; padding: 8px 11px; background: var(--bg-card); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px; transition: all 0.15s; outline: none; box-shadow: var(--shadow-xs); }
.form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
.form-input::placeholder { color: var(--text3); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

/* Card */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); position: relative; overflow: hidden; }
.card-pad { padding: 18px 20px; }
.card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); background: linear-gradient(to bottom, var(--bg3), var(--bg-card)); }
.card-title { font-size: 13px; font-weight: 700; color: var(--text); }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.b-blue   { background: var(--accent-lt);  color: var(--accent);  border: 1px solid rgba(37,99,235,0.2); }
.b-green  { background: var(--green-lt);   color: var(--green);   border: 1px solid rgba(21,128,61,0.2); }
.b-amber  { background: var(--amber-lt);   color: var(--amber);   border: 1px solid rgba(180,83,9,0.2); }
.b-red    { background: var(--red-lt);     color: var(--red);     border: 1px solid rgba(185,28,28,0.2); }
.b-purple { background: var(--purple-lt);  color: var(--purple);  border: 1px solid rgba(109,40,217,0.2); }
.b-teal   { background: var(--teal-lt);    color: var(--teal);    border: 1px solid rgba(15,118,110,0.2); }
.b-gray   { background: var(--bg4);        color: var(--text2);   border: 1px solid var(--border); }

/* SLA blink alert — an "oldest open" badge past the user's configured threshold pulses a light
   red background so it can't be missed at a glance (see app/emails/page.tsx,
   app/emails-support/page.tsx). A CSS animation on background-color overrides the badge's own
   inline background without needing !important — animations outrank normal-priority inline
   styles in the cascade. */
@keyframes sla-blink { 0%, 100% { background-color: #fecaca; } 50% { background-color: #fca5a5; } }
.sla-blink { animation: sla-blink 1s ease-in-out infinite; }

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead { background: linear-gradient(to bottom, var(--bg3), var(--bg4)); }
th { padding: 10px 13px; text-align: right; font-size: 10.5px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; border-bottom: 1px solid var(--border); }
td { padding: 10px 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--accent-lt); }
.td-muted { color: var(--text3); font-size: 11px; }
.td-mono { direction: ltr; text-align: right; font-size: 12px; }
tr.overdue-row td { background: #fff5f5; }
tr.overdue-row:hover td { background: #fee2e2; }

/* Stat cards */
.stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); cursor: default; transition: all 0.2s; position: relative; overflow: hidden; }
.stat-card.clickable { cursor: pointer; }
.stat-card.clickable:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: rgba(37,99,235,0.3); }
.stat-icon { width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 17px; margin-bottom: 10px; }
.stat-num { font-size: 26px; font-weight: 800; line-height: 1; letter-spacing: -0.5px; }
.stat-lbl { font-size: 10px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 5px; }

/* Case cards */
.case-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; box-shadow: var(--shadow-xs); transition: all 0.15s; cursor: pointer; position: relative; }
.case-card:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-1px); }
.case-card::before { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 3px; border-radius: 0 var(--radius) var(--radius) 0; background: transparent; transition: background 0.15s; }
.case-card:hover::before { background: var(--accent); }
.case-card.overdue { border-color: #fca5a5; background: #fff9f9; }
.case-card.overdue::before { background: var(--red); }
.case-card-name { font-size: 13px; font-weight: 600; }
.case-card-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 5px; }
.case-card-id { font-size: 11px; color: var(--text3); }

/* Misc */
.divider { height: 1px; background: linear-gradient(to left, transparent, var(--border), transparent); margin: 14px 0; }
.page-title { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.overdue-label { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; background: var(--red-lt); color: var(--red); border: 1px solid rgba(185,28,28,0.2); }
.filter-pills { display: flex; gap: 5px; flex-wrap: wrap; }
.pill { padding: 3px 11px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid var(--border2); background: var(--bg-card); color: var(--text2); cursor: pointer; transition: all 0.15s; }
.pill:hover { background: var(--bg4); }
.pill.active { background: linear-gradient(135deg,#2563eb,#1d4ed8); border-color: #1d4ed8; color: #fff; }
.dynamic-banner { background: linear-gradient(135deg,var(--accent-lt),#e0eaff); border: 1px solid rgba(37,99,235,0.25); border-radius: var(--radius-sm); padding: 9px 13px; font-size: 12px; color: var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: var(--bg4); color: var(--text2); border: 1px solid var(--border); }

/* Tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.tab { padding: 8px 18px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text2); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

/* Login */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#1e3a8a 0%,#2563eb 50%,#172e6e 100%); }
.login-card { width: 390px; padding: 40px; background: rgba(255,255,255,0.97); border-radius: var(--radius-lg); box-shadow: 0 24px 64px rgba(15,23,42,0.35); }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg,#111827,#1f2937); color: #fff; padding: 10px 24px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 999; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; backdrop-filter: blur(2px); }
.modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 24px; width: 820px; max-width: 100%; }
.modal-sm { width: 440px; }
.modal-lg { width: min(1400px, 96vw); }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.modal-title { font-size: 15px; font-weight: 700; }
.close-btn { background: var(--bg3); border: 1px solid var(--border); width: 30px; height: 30px; border-radius: var(--radius-xs); color: var(--text2); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.close-btn:hover { background: var(--red-lt); color: var(--red); border-color: #fca5a5; }

/* Log */
.log-entry { padding: 9px 10px; border-bottom: 1px solid var(--border); border-radius: var(--radius-xs); }
.log-entry:last-child { border-bottom: none; }
.log-meta { font-size: 11px; color: var(--text3); margin-bottom: 2px; }
.log-text { font-size: 13px; color: var(--text2); white-space: pre-wrap; }
.log-entry:hover { background: var(--bg3); }

/* Admin cat area */
.cat-block { margin-bottom: 12px; padding: 12px; background: var(--bg3); border-radius: var(--radius-sm); border: 1px solid var(--border); }

/* ===== MOBILE RESPONSIVE ===== */
@media (max-width: 768px) {

  /* Topbar — scrollable horizontal on mobile */
  .topbar {
    padding: 0 10px;
    gap: 2px;
    overflow-x: auto;
    height: 52px;
    -webkit-overflow-scrolling: touch;
  }
  .topbar::-webkit-scrollbar { display: none; }
  .topbar-brand { font-size: 14px; margin-left: 8px; flex-shrink: 0; }
  .nav-btn { padding: 5px 8px; font-size: 11px; flex-shrink: 0; }
  .topbar-right { gap: 6px; }
  .user-name { display: none; }
  .user-role { display: none; }
  .user-pill { padding: 4px 8px; }

  /* Page layout */
  div[style*="padding: 22px 26px"],
  div[style*="padding:'22px 26px'"] {
    padding: 12px !important;
  }

  /* Stats grid — 2 columns on mobile */
  .stats-grid {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 8px !important;
    margin-bottom: 12px !important;
  }
  .stat-card { padding: 12px 10px; }
  .stat-num { font-size: 22px; }
  .stat-lbl { font-size: 9px; }
  .stat-icon { width: 28px; height: 28px; font-size: 14px; margin-bottom: 6px; }

  /* Cards grid — single column */
  div[style*="grid-template-columns:'1fr 1fr 1fr'"],
  div[style*="gridTemplateColumns:'1fr 1fr 1fr'"],
  div[style*="grid-template-columns: 1fr 1fr 1fr"] {
    grid-template-columns: 1fr !important;
  }
  div[style*="grid-template-columns:'1fr 1fr'"],
  div[style*="gridTemplateColumns:'1fr 1fr'"],
  div[style*="grid-template-columns: 1fr 1fr"] {
    grid-template-columns: 1fr !important;
  }

  /* Modal — full screen */
  .modal-overlay {
    padding: 0 !important;
    align-items: flex-end !important;
  }
  .modal {
    width: 100% !important;
    max-width: 100% !important;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0 !important;
    max-height: 92vh;
    overflow-y: auto;
    padding: 16px !important;
  }
  .modal-sm {
    width: 100% !important;
  }

  /* Tabs — scrollable */
  .tabs {
    overflow-x: auto;
    flex-wrap: nowrap;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 8px 12px; font-size: 12px; white-space: nowrap; flex-shrink: 0; }

  /* Tables — horizontal scroll */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* Form rows */
  .form-row { grid-template-columns: 1fr !important; }
  .form-row-3 { grid-template-columns: 1fr !important; }

  /* Page header */
  .page-header {
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 10px !important;
  }
  .page-title { font-size: 15px; }

  /* Search input in topbar */
  .topbar input[placeholder*="חיפוש"] {
    width: 120px !important;
  }

  /* Toast */
  .toast { width: 90%; text-align: center; }
}

/* Small phones */
@media (max-width: 400px) {
  .stats-grid {
    grid-template-columns: repeat(2, 1fr) !important;
  }
  .nav-btn { padding: 4px 6px; font-size: 10px; }
}

      $('smsSend').onclick = function () {
        if (!tx.value.trim()) { toast('בחרו תבנית או כתבו הודעה'); return; }
        var text = tx.value.replace(/\{שם\}/g, c.name.split(' ')[0]);
        c.sms.push({ by: who(), at: new Date(), text: text }); c.logs.push({ by: who(), at: new Date(), text: 'נשלח SMS: ' + text, sys: true });
        showPhone(o.sms, text, function () { if (mine && S.step === 5) { S.smsDone = true; renderCase(id); later(function () { pulse(null); nextBtn('ליומן ←', function () { go(6); $('modal').innerHTML = ''; nav('cal'); }); later(function () { pulse(document.querySelector('#tour .tbtn.gold'), '👈 המשיכו ליומן'); }, 100); }, 200); } else renderCase(id); });
      };
    }
    stepHints(c);
  }
  function who() { return S.role === 'agent' ? ME : 'מנהלת המוקד'; }
  function stepHints(c) {
    if (c.id !== S.myCase) return;
    if (S.step === 4) {
      if (!S.noteDone && tab === 'details') later(function () { pulse($('newLog'), '👇 כתבו תיעוד של השיחה ולחצו הוסף'); }, 250);
      else if (!S.remDone && tab === 'details') later(function () { pulse($('addRem'), '👇 קבעו תזכורת לחזור ללקוח'); }, 250);
      else if (S.noteDone && S.remDone) { go(5); later(function () { pulse($('tab_sms'), '👇 עברו ללשונית SMS'); }, 250); }
    } else if (S.step === 5 && !S.smsDone) {
      if (tab !== 'sms') later(function () { pulse($('tab_sms'), '👇 עברו ללשונית SMS'); }, 250);
      else later(function () { pulse($('smsT'), '👇 בחרו תבנית'); }, 250);
    }
  }
  function timeline(c) {
    var ev = [{ at: c.created, by: c.agent, html: 'הפנייה נפתחה · ' + badge(c.logs.length && c.logs[0].sys && c.logs[0].text.indexOf('נפתחה') > -1 ? c.logs[0].text.split('"')[1] : c.status) }];
    c.logs.forEach(function (l) { if (l.text.indexOf('הפנייה נפתחה') === 0) return; ev.push({ at: l.at, by: l.by, html: (l.sys ? '' : '📝 ') + esc(l.text) }); });
    return ev.sort(function (a, b) { return a.at - b.at; });
  }
  function showPhone(sender, text, done) {
    $('phone').innerHTML = '<div class="phone"><div class="scr"><div class="hd"><div class="av">' + sender.charAt(0) + '</div><b>' + esc(sender) + '</b></div><div class="bd"><small>הודעת טקסט · היום ' + pad(new Date().getHours()) + ':' + pad(new Date().getMinutes()) + '</small><div class="msg">' + esc(text) + '</div></div></div><button class="x" id="phX">סגירה</button></div>';
    $('phone').classList.add('on'); toast('SMS נשלח ✓ (בהדגמה לא נשלח באמת)');
    later(function () { pulse($('phX'), '👇 כך הלקוח רואה את ההודעה. סגרו'); }, 200);
    $('phX').onclick = function () { $('phone').classList.remove('on'); pulse(null); done(); };
  }

  /* --- calendar --- */
  V.cal = function () {
    var days = '', heb = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
    for (var i = 0; i < 7; i++) { var d = dAgo(-i); var n = REMINDERS.filter(function (r) { return r.at.toDateString() === d.toDateString(); }).length; days += '<div class="' + (i === 0 ? 'today' : '') + '">' + heb[d.getDay()] + '<b>' + d.getDate() + '</b>' + (n ? '<i>' + n + '</i>' : '<span style="color:var(--text3)">·</span>') + '</div>'; }
    return '<div class="page-head"><div><h1>📅 יומן</h1><div class="s">התזכורות של ' + (S.role === 'agent' ? 'דנה' : 'הצוות') + ' לשבוע הקרוב</div></div><button class="btn btn-primary btn-sm" id="calNew">➕ תזכורת חדשה</button></div><div class="cal-strip">' + days + '</div>' +
      '<div class="card"><div class="table-wrap"><table><thead><tr><th>מתי</th><th>לקוח</th><th>הערה</th><th>פנייה</th></tr></thead><tbody>' +
      myReminders().map(function (r) { return '<tr class="' + (r.mine ? 'mine' : '') + '"' + (r.mine ? ' id="myRem"' : '') + ' data-case="' + r.caseId + '" style="cursor:pointer"><td><b>' + fmt(r.at) + '</b></td><td>' + esc(r.name) + '</td><td>' + esc(r.note) + '</td><td class="td-muted">#' + r.caseId + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  };
  A.cal = function () {
    bindRows(); $('calNew').onclick = function () { toast('אפשר לקבוע תזכורת גם בלי פנייה'); };
    if (S.step === 6) {
      later(function () { if ($('myRem')) pulse($('myRem'), '✓ התזכורת שלכם ביומן'); }, 300);
      nextBtn('עוברים לכובע המנהל ←', function () { S.role = 'manager'; go(7); toast('נכנסתם כמנהלת המוקד'); nav('exc'); });
    }
  };

  /* --- manager: exceptions --- */
  function isBreach(c) { return (c.status === 'בטיפול נציג' || c.status === 'בטיפול בשיחת מנהל') && (NOW - c.created) / 864e5 > SLA_DAYS && !c.moved; }
  function breaches() { return CASES.filter(isBreach); }
  V.exc = function () {
    var b = breaches(), byOrg = ORGS.map(function (o) { return { o: o, list: b.filter(function (c) { return c.org === o.id; }) }; });
    var h = '<div class="page-head"><div><h1>⏱️ חריגות</h1><div class="s">פניות בטיפול נציג / בשיחת מנהל מעל ' + SLA_DAYS + ' ימים (מוגדר בניהול)</div></div></div><div class="orgs4">' +
      byOrg.map(function (x) { return '<div class="orgc' + (S.excOrg === x.o.id ? ' on' : '') + '" data-org="' + x.o.id + '"><b>' + esc(x.o.name) + '</b><div class="n">' + x.list.length + '</div><small>פניות בחריגה</small></div>'; }).join('') + '</div>';
    if (S.excOrg) {
      var list = CASES.filter(function (c) { return c.org === S.excOrg && (isBreach(c) || c.moved); });
      h += '<div class="card"><div class="card-header"><div class="card-title">' + esc(org(S.excOrg).name) + ' · לפי נציג</div></div><div class="table-wrap"><table><thead><tr><th>נציג</th><th>לקוח</th><th>סטטוס</th><th>פתוחה כבר</th><th></th></tr></thead><tbody>' +
        (list.length ? list.map(function (c) { var days = Math.floor((NOW - c.created) / 864e5); return '<tr class="' + (c.moved ? '' : 'overdue-row') + '"><td><b>' + esc(c.moved ? c.agent : c.agent) + '</b></td><td>' + esc(c.name) + '<div class="td-muted">#' + c.id + ' · ' + esc(c.subject) + '</div></td><td>' + badge(c.status) + '</td><td>' + (c.moved ? '<span class="badge b-green">הועברה ל' + esc(c.agent) + '</span>' : '<span class="badge b-red sla-blink">' + days + ' ימים</span>') + '</td><td>' + (c.moved ? '' : '<button class="btn btn-xs" data-tr="' + c.id + '" style="background:#eff4ff;color:#2563eb;border:1px solid #bfdbfe">🔄 העבר לנציג</button> <button class="btn btn-xs" data-case="' + c.id + '">פתח</button>') + '</td></tr>'; }).join('') : '<tr><td colspan="5" class="td-muted">אין חריגות בארגון הזה 👌</td></tr>') + '</tbody></table></div></div>';
    } else h += '<div class="card card-pad" style="color:var(--text2)">בחרו ארגון כדי לראות את הפניות התקועות לפי נציג.</div>';
    return h;
  };
  A.exc = function () {
    document.querySelectorAll('[data-org]').forEach(function (o) { o.onclick = function () { S.excOrg = o.getAttribute('data-org'); nav('exc'); }; });
    document.querySelectorAll('[data-tr]').forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); transferModal(caseById(+b.getAttribute('data-tr'))); }; });
    bindRows();
    if (S.step === 7 && !S.transferred) {
      if (!S.excOrg) later(function () { var best = document.querySelector('[data-org="gym"]'); pulse(best, '👇 בחרו ארגון'); }, 300);
      else later(function () { var b = document.querySelector('[data-tr]'); if (b) pulse(b, '👇 העבירו את הפנייה לנציג אחר'); else pulse(document.querySelector('[data-org="gym"]'), '👇 נסו את רשת כושר פלוס'); }, 300);
    }
  };
  function transferModal(c) {
    var opts = AGENTS.filter(function (a) { return a !== c.agent; }).map(function (a) { return '<option>' + a + '</option>'; }).join('');
    $('phone').innerHTML = '<div class="modal modal-sm" style="position:relative"><div class="modal-header"><div class="modal-title">🔄 העברת פניה #' + c.id + '</div><button class="close-btn" id="trX">✕</button></div><div style="font-size:13px;margin-bottom:10px">' + esc(c.name) + ' · כרגע אצל <b>' + esc(c.agent) + '</b></div><label class="form-label">העבר לנציג</label><select class="form-input" id="trTo">' + opts + '</select><label class="form-label" style="margin-top:10px">הערה לנציג</label><input class="form-input" id="trNote" value="דחוף, הלקוח מחכה מעל ' + SLA_DAYS + ' ימים"><button class="btn btn-primary" id="trGo" style="margin-top:14px;width:100%;justify-content:center">העבר</button></div>';
    $('phone').classList.add('on');
    later(function () { pulse($('trGo'), '👇 בחרו נציג ולחצו העבר'); }, 200);
    $('trX').onclick = function () { $('phone').classList.remove('on'); pulse(null); };
    $('trGo').onclick = function () {
      var to = $('trTo').value, from = c.agent; c.agent = to; c.moved = true;
      c.logs.push({ by: 'מנהלת המוקד', at: new Date(), text: 'הפנייה הועברה מ' + from + ' ל' + to + ': ' + $('trNote').value, sys: true });
      $('phone').classList.remove('on'); pulse(null); toast('הפנייה הועברה ל' + to + ' ✓ והנציג קיבל התראה');
      $('modal').innerHTML = '';
      if (S.step === 7) { S.transferred = true; nav('exc'); nextBtn('לדשבורד המנהל ←', function () { go(8); nav('dash'); }); later(function () { pulse(document.querySelector('#tour .tbtn.gold'), '👈 המשיכו לדשבורד'); }, 300); }
      else nav(S.view);
    };
  }

  /* --- manager: dashboard --- */
  V.dash = function () {
    var total = 1283 + CASES.length, open = CASES.filter(function (c) { return c.status !== 'טופל' && c.status !== 'טופל לאחר שיחת מנהל'; }).length + 41;
    var byStatus = STATUSES.map(function (s) { return [s, CASES.filter(function (c) { return c.status === s; }).length * 9 + ({ 'טופל': 160, 'בטיפול נציג': 30, 'אין מענה': 12 }[s] || 6)]; });
    var max = Math.max.apply(null, byStatus.map(function (x) { return x[1]; }));
    var agentRows = AGENTS.map(function (a, i) { var mine = CASES.filter(function (c) { return c.agent === a; }); var n = 180 - i * 17 + mine.length, done = Math.round(n * (0.93 - i * 0.03)); return '<tr' + (a === ME ? ' class="mine"' : '') + '><td><b>' + a + '</b></td><td>' + n + '</td><td>' + done + '</td><td>' + Math.round(done / n * 100) + '%</td><td>' + mine.filter(isBreach).length + '</td></tr>'; }).join('');
    var pts = [], vals = [38, 42, 35, 47, 51, 29, 18, 44, 49, 46, 52, 55, 31, 20, 48, 50, 47, 58, 61, 33, 22, 53, 57, 54, 60, 63, 36, 24, 58, 40 + CASES.filter(function (c) { return isToday(c.created); }).length];
    var vmax = 70; vals.forEach(function (v, i) { pts.push((i * (600 / 29)).toFixed(1) + ',' + (140 - v / vmax * 130).toFixed(1)); });
    return '<div class="page-head"><div><h1>🎯 דשבורד</h1><div class="s">כל המוקד · 30 הימים האחרונים</div></div><button class="btn btn-success btn-sm" id="exportBtn">⬇️ ייצוא לאקסל</button></div>' +
      '<div class="stats-grid">' + stat('🗂️', '#eff4ff', total.toLocaleString('en-US'), 'סך הפניות', '#2563eb') + stat('📥', '#fffbeb', open, 'פתוחות', '#b45309') + stat('✅', '#f0fdf4', 47, 'טופלו היום', '#15803d') + stat('⏱️', '#fef2f2', breaches().length, 'חריגות SLA', '#b91c1c') + stat('⚡', '#f5f3ff', '5.2 ש׳', 'זמן טיפול ממוצע', '#6d28d9') + '</div>' +
      '<div class="g2" style="margin-bottom:16px"><div class="card"><div class="card-header"><div class="card-title">📊 פניות לפי סטטוס</div></div><div class="card-pad">' + byStatus.map(function (x) { return '<div class="bar"><span>' + x[0] + '</span><i style="width:' + Math.max(4, x[1] / max * 100) + '%"></i><em>' + x[1] + '</em></div>'; }).join('') + '</div></div>' +
      '<div class="card"><div class="card-header"><div class="card-title">📈 מגמה יומית (30 יום)</div></div><div class="card-pad"><svg class="trend" viewBox="0 0 600 150" preserveAspectRatio="none"><polyline fill="none" stroke="#2563eb" stroke-width="2.5" points="' + pts.join(' ') + '"/><polygon fill="rgba(37,99,235,.08)" points="0,150 ' + pts.join(' ') + ' 600,150"/><circle cx="600" cy="' + pts[29].split(',')[1] + '" r="5" fill="#16a34a"/></svg><div style="font-size:11px;color:var(--text3)">הנקודה הירוקה: היום, כולל הפנייה שפתחתם</div></div></div></div>' +
      '<div class="card" id="agentsCard"><div class="card-header"><div class="card-title">👥 ביצועים לפי נציג</div></div><div class="table-wrap"><table><thead><tr><th>נציג</th><th>פניות</th><th>טופלו</th><th>אחוז טיפול</th><th>חריגות</th></tr></thead><tbody>' + agentRows + '</tbody></table></div></div>';
  };
  A.dash = function () {
    $('exportBtn').onclick = function () {
      var rows = [['מספר', 'לקוח', 'טלפון', 'ארגון', 'נושא', 'סטטוס', 'נציג', 'נפתחה']].concat(sorted().map(function (c) { return [c.id, c.name, phoneFmt(c.phone), org(c.org).name, c.subject, c.status, c.agent, fmt(c.created)]; }));
      var csv = '﻿' + rows.map(function (r) { return r.map(function (x) { return '"' + String(x).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'crm-demo-cases.csv'; document.body.appendChild(a); a.click(); a.remove();
      toast('הקובץ ירד ✓ (נתוני הדגמה)');
      if (S.step === 8) { pulse(null); go(9); }
    };
    if (S.step === 8) { later(function () { pulse($('exportBtn'), '👇 נסו לייצא לאקסל'); }, 400); nextBtn('סיום ←', function () { go(9); }); }
  };

  /* boot */
  renderTour(); lgLogin();
  later(function () { pulse($('lgGo'), '👇 לחצו כאן כדי להיכנס'); }, 400);
})();
</script>
</body>
</html>
