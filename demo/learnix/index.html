<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הדגמת LearnIx</title>
<script src="../demo-analytics.js"></script>
<meta name="robots" content="noindex, follow">
<meta name="description" content="הדגמה חיה של LearnIx: תדריך שמנוסח עם AI, מבחן שנבנה אוטומטית, כניסת עובד, שאלות ל-AI מתוך בסיס הידע ודשבורד מעקב למנהל. הכל מדומה.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  /* v1.9 "Nectar — Refined" palette */
  --ink:     #F7F5FB;
  --ink2:    #FEFDFF;
  --ink3:    #F1EDFA;
  --ink4:    #E5DFF5;
  --line:    rgba(36,31,61,0.08);
  --line2:   rgba(36,31,61,0.13);
  --line3:   rgba(36,31,61,0.22);
  --gold:    #7469A6;
  --gold2:   #9085C8;
  --gold-bg: rgba(116,105,166,0.08);
  --gold-line: rgba(116,105,166,0.25);
  --ice:     #241F3D;
  --ice2:    #4B4470;
  --ice3:    #756F92;
  --ice4:    #A9A3C4;
  --ok:      #0E9C7C;
  --ok-bg:   rgba(14,156,124,0.08);
  --ok-line: rgba(14,156,124,0.25);
  --warn:    #B8710F;
  --warn-bg: rgba(184,113,15,0.08);
  --warn-line: rgba(184,113,15,0.25);
  --danger:  #C43B36;
  --danger-bg: rgba(196,59,54,0.08);
  --danger-line: rgba(196,59,54,0.25);
  --accent2:    #17A99C;
  --accent2-bg: rgba(23,169,156,0.08);
  --accent2-line: rgba(23,169,156,0.25);
  --ink-accent: #4B3F82;
  --r: 12px;
  --r2: 20px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Sora', sans-serif;
  background: var(--ink);
  color: var(--ice);
  direction: rtl;
  min-height: 100vh;
  overflow-x: hidden;
}

/* DOT GRID */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(rgba(116,105,166,0.06) 1px, transparent 1px);
  background-size: 24px 24px;
}

/* SOFT FADE + GLOW */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 420px 300px at 96% -4%, rgba(247,245,251,0.85) 0%, transparent 60%),
    radial-gradient(ellipse 320px 300px at -2% 104%, rgba(247,245,251,0.8) 0%, transparent 55%),
    radial-gradient(ellipse 600px 400px at 80% 10%, rgba(116,105,166,0.04) 0%, transparent 70%),
    radial-gradient(ellipse 400px 600px at 10% 80%, rgba(23,169,156,0.03) 0%, transparent 70%);
}

/* Shared texture for full-screen overlays (login / PIN screens) */
.dot-bg {
  background-color: var(--ink);
  background-image:
    radial-gradient(ellipse 420px 300px at 96% -4%, rgba(247,245,251,0.85) 0%, transparent 60%),
    radial-gradient(ellipse 320px 300px at -2% 104%, rgba(247,245,251,0.8) 0%, transparent 55%),
    radial-gradient(rgba(116,105,166,0.06) 1px, transparent 1px);
  background-size: auto, auto, 24px 24px;
}

/* TOP BAR */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(24px) saturate(200%);
  -webkit-backdrop-filter: blur(24px) saturate(200%);
  border-bottom: 1px solid rgba(116,105,166,0.15);
  box-shadow: 0 1px 20px rgba(0,0,0,0.06);
}
.topbar-inner {
  max-width: 100%;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 58px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: #FFFFFF;
  box-shadow: 0 3px 8px rgba(116,105,166,0.25), inset 0 1px 1px rgba(255,255,255,0.4);
  position: relative; overflow: hidden;
}
.brand-mark::before {
  content: '';
  position: absolute; inset: -3px;
  border-radius: 50%;
  border: 1px solid rgba(116,105,166,0.25);
  pointer-events: none;
}
.brand-mark img { width: 100%; height: 100%; object-fit: cover; position: relative; }
.brand-logo-svg { width: 62%; height: 62%; position: relative; overflow: visible; }
.lx-bar { transform-box: fill-box; transform-origin: center bottom; animation: lx-rise 0.5s cubic-bezier(0.22,1,0.36,1) both; }
.lx-bar-1 { animation-delay: 0.05s; }
.lx-bar-2 { animation-delay: 0.18s; }
.lx-bar-3 { animation-delay: 0.31s; }
.lx-arrow { stroke-dasharray: 26; stroke-dashoffset: 26; animation: lx-draw 0.35s ease-out both; animation-delay: 0.52s; }
@keyframes lx-rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes lx-draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  .lx-bar, .lx-arrow { animation: none; }
}
.brand-name { font-size: 13px; font-weight: 600; color: var(--ice); letter-spacing: 0.02em; }
.brand-sub { font-size: 10px; color: var(--ice3); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 1px; font-family: 'DM Mono', monospace; }

/* NAV */
.nav { display: flex; gap: 2px; }
.nav-btn {
  position: relative;
  font-family: 'Sora', sans-serif;
  font-size: 12px; font-weight: 500;
  padding: 7px 16px; cursor: pointer;
  border: none; background: none;
  color: var(--ice3); border-radius: 8px;
  transition: color 0.2s, background 0.2s;
  letter-spacing: 0.01em;
  display: flex; align-items: center; gap: 6px;
}
.nav-btn .nav-icon { font-size: 13px; display: inline-block; transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), filter 0.2s; }
.nav-btn:hover .nav-icon { transform: scale(1.22); filter: drop-shadow(0 0 6px rgba(116,105,166,0.55)); }
.nav-btn.active .nav-icon { transform: scale(1.1); filter: drop-shadow(0 0 5px rgba(116,105,166,0.4)); }
.nav-btn.active:hover .nav-icon { transform: scale(1.22); filter: drop-shadow(0 0 7px rgba(116,105,166,0.6)); }
#dashboard-sidebar .sb-btn span[style*="font-size:18px"] { display: inline-block; transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), filter 0.2s; }
#dashboard-sidebar .sb-btn:hover span[style*="font-size:18px"] { transform: scale(1.22); filter: drop-shadow(0 0 6px rgba(116,105,166,0.55)); }
.nav-btn:hover { color: var(--ice); background: rgba(255,255,255,0.04); }
.nav-btn.active { color: var(--gold); background: var(--gold-bg); }
.nav-btn.active::after {
  content: '';
  position: absolute; bottom: -1px; right: 12px; left: 12px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* PAGE */
.page { max-width: 100%; margin: 0; padding: 2rem 1.5rem; position: relative; z-index: 1; }
.sec { display: none; }
.sec.active { display: block; animation: rise 0.3s cubic-bezier(0.22,1,0.36,1); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* API SETUP MODAL */
.api-modal {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(245,244,240,0.95);
  backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center;
  animation: rise 0.3s ease;
}
.api-modal.hidden { display: none; }
.api-modal-box {
  background: var(--ink2);
  border: 1px solid var(--line2);
  border-radius: 20px;
  padding: 2.5rem;
  width: 420px; max-width: 90vw;
  position: relative; overflow: hidden;
}
.api-modal-box::before {
  content: '';
  position: absolute; top: 0; right: 0; left: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.api-modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 22px; color: var(--ice);
  margin-bottom: 6px;
}
.api-modal-sub { font-size: 13px; color: var(--ice3); line-height: 1.7; margin-bottom: 24px; }
.api-modal-sub a { color: var(--gold2); text-decoration: none; }
.api-modal-sub a:hover { text-decoration: underline; }

/* SECTION HEADER */
.sec-header { margin-bottom: 2rem; }
.sec-eyebrow { font-size: 10px; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: 0.12em; font-family: 'DM Mono', monospace; margin-bottom: 8px; }
.sec-title { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--ice); font-weight: 400; }
.sec-title em { font-style: italic; color: var(--gold2); }

/* CARDS */
.card {
  background: var(--ink2);
  border: 1px solid rgba(36,31,61,0.05);
  border-radius: var(--r2);
  padding: 1.75rem;
  margin-bottom: 16px;
  position: relative; overflow: hidden;
  box-shadow: 0 1px 2px rgba(36,31,61,0.04), 0 8px 20px rgba(36,31,61,0.05);
  transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s;
}
.card:hover { border-color: rgba(116,105,166,0.2); box-shadow: 0 4px 10px rgba(36,31,61,0.06), 0 16px 32px rgba(36,31,61,0.09); transform: translateY(-2px); }
.card::before {
  content: '';
  position: absolute; top:0; right:0; left:0; height:2px; pointer-events:none;
  background: linear-gradient(90deg, var(--gold), transparent 70%);
  opacity: 0; transition: opacity 0.2s; border-radius: inherit;
}
.card:hover::before { opacity: 0.6; }
.card-label { font-size: 10px; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: 0.1em; font-family: 'DM Mono', monospace; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
.card-label::before { content: ''; width: 16px; height: 1px; background: var(--gold); display: inline-block; }

/* FORM */
.field { margin-bottom: 18px; }
.field:last-child { margin-bottom: 0; }
.field-label {
  font-size: 10px; font-weight: 600; color: var(--ice3);
  text-transform: uppercase; letter-spacing: 0.08em;
  font-family: 'DM Mono', monospace;
  display: block; margin-bottom: 8px;
}
input[type=text], input[type=password], textarea {
  width: 100%;
  background: var(--ink3);
  border: 1px solid var(--line2);
  border-radius: var(--r);
  padding: 11px 15px;
  font-size: 14px; font-family: 'Sora', sans-serif;
  color: var(--ice); direction: rtl;
  transition: border-color 0.2s, background 0.2s;
  outline: none;
}
input[type=text]:focus, input[type=password]:focus, textarea:focus {
  border-color: var(--gold-line);
  background: var(--ink4);
  box-shadow: 0 0 0 3px rgba(116,105,166,0.07);
}
textarea { resize: vertical; min-height: 130px; line-height: 1.75; }
input::placeholder, textarea::placeholder { color: var(--ice4); }

/* BUTTONS */
.btn {
  font-family: 'Sora', sans-serif;
  font-size: 13px; font-weight: 500;
  border-radius: var(--r);
  padding: 10px 22px; cursor: pointer;
  border: none; display: inline-flex; align-items: center; gap: 8px;
  transition: all 0.2s; letter-spacing: 0.01em;
  position: relative; overflow: hidden;
}
.btn-gold {
  background: linear-gradient(135deg, #7469A6, #9085C8);
  color: #0B0C10; font-weight: 600;
}
.btn-gold::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
  opacity: 0; transition: opacity 0.2s;
}
.btn-gold:hover::before { opacity: 1; }
.btn-gold:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(116,105,166,0.25); }
.btn-gold:active { transform: translateY(0); }
.btn-gold:disabled { background: var(--ink4); color: var(--ice4); cursor: not-allowed; box-shadow: none; transform: none; }
.btn-outline {
  background: transparent;
  border: 1px solid var(--line2);
  color: var(--ice2);
}
.btn-outline:hover { border-color: var(--line3); color: var(--ice); background: rgba(255,255,255,0.03); }
.btn-ghost { background: none; border: none; color: var(--ice3); padding: 8px 12px; }
.btn-ghost:hover { color: var(--ice2); }
.btn-danger-soft {
  background: var(--danger-bg); border: 1px solid var(--danger-line);
  color: var(--danger); font-size: 12px; padding: 6px 12px;
}
.btn-danger-soft:hover { background: rgba(196,59,54,0.14); }
.btn-sm { padding: 7px 14px; font-size: 12px; }

/* CHIPS / BADGES */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; font-family: 'DM Mono', monospace; letter-spacing: 0.02em; }
.chip-ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-line); }
.chip-warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); }
.chip-gold { background: var(--gold-bg); color: var(--gold2); border: 1px solid var(--gold-line); }
.chip-muted { background: rgba(255,255,255,0.05); color: var(--ice3); border: 1px solid var(--line); }
.chip-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-line); }

/* AVATAR */
.agent-row-clickable { cursor:pointer; transition:background 0.15s; }
.agent-row-clickable:hover { background:var(--ink3); border-color:var(--gold-line); }
.av { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; font-family: 'DM Mono', monospace; letter-spacing: 0; }

/* STATS */
.kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 2rem; }
.kpi {
  background: var(--ink2); border: 1px solid var(--line);
  border-radius: var(--r2); padding: 20px;
  position: relative; overflow: hidden;
}
.kpi::after { content: ''; position: absolute; top: 0; right: 0; width: 40%; height: 1px; }
.kpi:nth-child(1)::after { background: linear-gradient(90deg, var(--gold), transparent); }
.kpi:nth-child(2)::after { background: linear-gradient(90deg, var(--ok), transparent); }
.kpi:nth-child(3)::after { background: linear-gradient(90deg, var(--warn), transparent); }
.kpi:nth-child(4)::after { background: linear-gradient(90deg, var(--ink-accent), transparent); }
.kpi { transition: transform 0.18s ease, box-shadow 0.18s ease; }
.kpi:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(36,31,61,0.06), 0 16px 32px rgba(36,31,61,0.10); }
.kpi-val { font-size: 34px; font-weight: 300; color: var(--ink-accent); line-height: 1; font-family: 'Playfair Display', serif; letter-spacing: -0.02em; }
.kpi-label { font-size: 10px; color: var(--ice3); margin-top: 8px; text-transform: uppercase; letter-spacing: 0.08em; font-family: 'DM Mono', monospace; }

/* PROGRESS */
.prog-wrap { margin-bottom: 2rem; }
.prog-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.prog-title { font-size: 13px; font-weight: 500; color: var(--ice2); }
.prog-pct { font-size: 11px; color: var(--ice3); font-family: 'DM Mono', monospace; }
.prog-track { height: 3px; background: var(--ink4); border-radius: 2px; overflow: hidden; }
.prog-bar { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--gold), var(--gold2)); transition: width 0.5s cubic-bezier(0.22,1,0.36,1); }

/* QUIZ */
.q-wrap { margin-bottom: 14px; }
.q-card {
  background: var(--ink2); border: 1px solid var(--line);
  border-radius: var(--r2); padding: 20px; overflow: hidden;
  position: relative;
  box-shadow: 0 1px 2px rgba(36,31,61,0.04), 0 8px 20px rgba(36,31,61,0.05);
}
.q-card::before { content: ''; position: absolute; top: 0; right: 0; left: 0; height: 1px; background: linear-gradient(90deg, var(--gold-line), transparent); }
.q-idx { font-size: 10px; color: var(--gold); font-family: 'DM Mono', monospace; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
.q-text { font-size: 16px; font-weight: 500; color: var(--ice); line-height: 1.6; margin-bottom: 16px; }
.opt {
  padding: 12px 16px;
  border: 1px solid var(--line2);
  border-radius: var(--r);
  margin-bottom: 8px; cursor: pointer;
  font-size: 14px; color: var(--ice2);
  transition: all 0.18s;
  display: flex; align-items: center; gap: 12px;
  background: var(--ink3);
}
.opt:hover { border-color: var(--gold-line); color: var(--ice); background: var(--gold-bg); }
.opt-key {
  width: 26px; height: 26px; flex-shrink: 0;
  border: 1px solid var(--line2); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: var(--ice3);
  font-family: 'DM Mono', monospace;
  transition: all 0.18s;
}
.opt:hover .opt-key { border-color: var(--gold); color: var(--gold); background: var(--gold-bg); }
.opt.reveal-ok { border-color: var(--ok-line); background: var(--ok-bg); color: var(--ok); }
.opt.reveal-ok .opt-key { border-color: var(--ok); color: var(--ok); background: rgba(14,156,124,0.15); }
.opt.reveal-wrong { border-color: var(--danger-line); background: var(--danger-bg); color: var(--danger); }
.opt.reveal-wrong .opt-key { border-color: var(--danger); color: var(--danger); }
.hint-reveal {
  font-size: 13px; color: var(--ice3); line-height: 1.6;
  background: var(--ink3); border-radius: var(--r);
  padding: 12px 15px; margin-top: 10px;
  border-right: 2px solid var(--gold);
  display: none;
}

/* EDIT QUESTIONS */
.eq-card {
  background: var(--ink2); border: 1px solid var(--gold-line);
  border-radius: var(--r2); padding: 22px; margin-bottom: 14px;
  position: relative; overflow: hidden;
  box-shadow: 0 1px 2px rgba(36,31,61,0.04), 0 8px 20px rgba(36,31,61,0.05);
}
.eq-card::before { content: ''; position: absolute; top: 0; right: 0; left: 0; height: 1px; background: linear-gradient(90deg, var(--gold), transparent 60%); }
.eq-label { font-size: 10px; color: var(--gold); font-family: 'DM Mono', monospace; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 14px; }
.opt-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.opt-row input { flex: 1; }
.radio-pick {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--ice3);
  padding: 7px 11px;
  border: 1px solid var(--line2); border-radius: 8px;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
  font-family: 'DM Mono', monospace;
}
.radio-pick input[type=radio] { accent-color: var(--ok); width: 13px; height: 13px; cursor: pointer; }
.radio-pick.chosen { border-color: var(--ok-line); background: var(--ok-bg); color: var(--ok); }

/* RESULT */
.score-display { text-align: center; padding: 2.5rem 1rem; }
.score-num {
  font-family: 'Playfair Display', serif;
  font-size: 80px; font-weight: 400; line-height: 1;
  letter-spacing: -0.03em;
}
.score-num.s-great { color: var(--ok); }
.score-num.s-mid { color: var(--warn); }
.score-num.s-low { color: var(--danger); }
.score-sub { font-size: 14px; color: var(--ice3); margin-top: 8px; font-weight: 300; }

/* SIG */
.sig-block {
  background: var(--ink3); border: 1px solid var(--line2);
  border-radius: var(--r2); padding: 22px; margin-top: 18px;
}

/* AGENT SELECT */
.agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 12px; margin-top: 18px; }
.agent-pick {
  background: #FFFFFF;
  border: 1.5px solid rgba(116,105,166,0.12);
  border-radius: 20px; padding: 22px 14px;
  cursor: pointer; text-align: center;
  transition: all 0.2s;
  position: relative; overflow: hidden;
  box-shadow: 0 1px 2px rgba(36,31,61,0.04), 0 8px 18px rgba(36,31,61,0.06);
}
.agent-pick::before { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(116,105,166,0.04) 0%, transparent 60%); opacity: 0; transition: opacity 0.2s; border-radius:inherit; }
.agent-pick:hover { border-color: var(--gold); transform: translateY(-4px); box-shadow: 0 16px 36px rgba(116,105,166,0.15); }
.agent-pick:hover::before { opacity: 1; }
.agent-pick-name { font-size: 13px; font-weight: 600; color: var(--ice); margin-top: 12px; }

/* BRIEFING ROW */
.brief-row {
  background: #FFFFFF;
  border: 1px solid rgba(116,105,166,0.1);
  border-radius: var(--r2); padding: 18px 22px;
  margin-bottom: 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  transition: all 0.2s; position: relative; overflow: hidden;
  box-shadow: 0 1px 2px rgba(36,31,61,0.03), 0 6px 16px rgba(36,31,61,0.05);
}
.brief-row::before { content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 3px; background: transparent; transition: background 0.2s; }
.brief-row:hover { border-color: var(--line2); background: var(--ink3); }
.brief-row:hover::before { background: var(--gold); }

/* TRACKING AGENT */
.track-row { background: #FFFFFF; border: 1px solid rgba(116,105,166,0.1); border-radius: var(--r2); padding: 18px 22px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(36,31,61,0.03), 0 6px 16px rgba(36,31,61,0.05); }
.done-pill { background: var(--ink3); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 12px; font-size: 12px; }
.done-pill-title { color: var(--ice2); font-weight: 500; }
.done-pill-meta { color: var(--ok); font-size: 11px; margin-top: 2px; font-family: 'DM Mono', monospace; }

/* LOCK */
.lock-scene { display: flex; align-items: center; justify-content: center; min-height: 360px; }
.lock-box {
  background: #FFFFFF;
  border: 1px solid rgba(116,105,166,0.15);
  border-radius: 24px; padding: 3rem 2.5rem;
  width: 360px; text-align: center;
  position: relative; overflow: hidden;
  box-shadow: 0 20px 60px rgba(36,31,61,0.12), 0 4px 16px rgba(36,31,61,0.07);
}
.lock-box::before { content: ''; position: absolute; top: 0; right: 0; left: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.lock-ico { font-size: 36px; margin-bottom: 18px; filter: drop-shadow(0 0 12px rgba(116,105,166,0.3)); }
.lock-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--ice); margin-bottom: 6px; }
.lock-sub { font-size: 13px; color: var(--ice3); margin-bottom: 22px; }

/* AGENT LOGGED */
.agent-logged-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; }
.agent-logged-name { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--ice); font-weight: 400; }
.agent-logged-sub { font-size: 12px; color: var(--ice3); margin-top: 4px; }

/* SUCCESS */
.success-bar { background: var(--ok-bg); border: 1px solid var(--ok-line); border-radius: var(--r); padding: 16px 18px; margin-top: 16px; }
.success-bar-t { font-size: 14px; font-weight: 600; color: var(--ok); }
.success-bar-s { font-size: 12px; color: rgba(14,156,124,0.6); margin-top: 3px; font-family: 'DM Mono', monospace; }

/* LOADING */
.loading { display: none; align-items: center; gap: 10px; font-size: 13px; color: var(--ice3); }
.dot-row { display: flex; gap: 5px; }
.ld { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); animation: blink 1.4s infinite ease-in-out; }
.ld:nth-child(2){animation-delay:.2s} .ld:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.15;transform:scale(0.7)}40%{opacity:1;transform:scale(1)}}
@keyframes slide-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* DIVIDER */
.div { height: 1px; background: var(--line); margin: 2rem 0; }
.eyebrow { font-size: 10px; font-weight: 600; color: var(--ice4); text-transform: uppercase; letter-spacing: 0.1em; font-family: 'DM Mono', monospace; margin-bottom: 12px; }

.row { display: flex; align-items: center; gap: 12px; }
.between { display: flex; justify-content: space-between; align-items: center; }

.dept-chip { display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-line);font-family:'DM Mono',monospace;letter-spacing:0.02em; }
.dept-filter-bar { display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem;align-items:center; }
.dept-filter-btn { font-size:11px;font-weight:600;padding:6px 13px;border-radius:20px;cursor:pointer;border:1px solid var(--line2);background:var(--ink3);color:var(--ice3);font-family:'DM Mono',monospace;transition:all 0.15s; }
.dept-filter-btn:hover { border-color:var(--gold-line);color:var(--gold); }
.dept-filter-btn.active { background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold); }
.dept-checkbox-grid { display:flex;gap:8px;flex-wrap:wrap;margin-top:10px; }
.dept-cb { display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ice2);cursor:pointer;padding:5px 10px;border:1px solid var(--line2);border-radius:8px;transition:all 0.15s;font-family:'DM Mono',monospace; }
.dept-cb:hover { border-color:var(--gold-line);color:var(--gold); }
.dept-cb input[type=checkbox] { accent-color:var(--gold);width:13px;height:13px;cursor:pointer; }
.dept-cb.checked { border-color:var(--gold-line);background:var(--gold-bg);color:var(--gold); }
/* SCROLLBAR */
@keyframes pulse-red { 0%,100%{opacity:1} 50%{opacity:0.5} }
@keyframes ai-ask-pulse {
  0%,100% { box-shadow: 0 8px 26px rgba(116,105,166,0.35), 0 0 0 0 rgba(116,105,166,0.45); }
  50%     { box-shadow: 0 8px 26px rgba(116,105,166,0.35), 0 0 0 10px rgba(116,105,166,0); }
}
.ai-ask-btn { animation: ai-ask-pulse 2.4s ease-out infinite; }
@keyframes pending-quick-pulse-kf {
  0%,100% { box-shadow: 0 0 0 0 rgba(14,156,124,0.45); border-color: var(--accent2-line); }
  50%     { box-shadow: 0 0 0 10px rgba(14,156,124,0); border-color: var(--accent2); }
}
.pending-quick-pulse { animation: pending-quick-pulse-kf 2.4s ease-out infinite; background: var(--accent2-bg)!important; }
@media (prefers-reduced-motion: reduce) { .ai-ask-btn, .pending-quick-pulse { animation: none; } }
.chip-muted { background:var(--surface2);color:var(--ice3);border:1px solid var(--line); }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 3px; }

/* ══════════════════════════════════════════════════
   BOTTOM NAV — premium tab bar like iOS
══════════════════════════════════════════════════ */
.bottom-nav {
  display: none;
  position: fixed; bottom: 0; right: 0; left: 0; z-index: 200;
  background: rgba(255,255,255,0.97);
  box-shadow: 0 -1px 0 rgba(116,105,166,0.1);

.bnav-btn {

  .page { padding-bottom:max(110px, calc(80px + env(safe-area-inset-bottom)))!important; }
  .bottom-nav { padding-bottom:max(14px, env(safe-area-inset-bottom))!important; }

  #kp-ai-feedback { padding:0 !important; }

  #tab-discipline .sec > div:first-child { flex-direction:column !important; }

  #tab-discipline [style*="flex:1"] { min-width:0 !important; }

  #disc-edit-modal > div,

  #rating-feedback-modal > div {

    left:0 !important;
    right:0 !important;

    overflow-y:auto !important;

  #warning-template-modal,

  /* ── GRIDS → single column ── */
  [style*="grid-template-columns:1fr 1fr 1fr 1fr"],

  #tab-tracking, #tab-manager, #tab-settings { padding:12px!important; }

/* ══ SKELETON LOADING ══════════════════════════════ */
@keyframes skel-shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
.skel-card {
  background:var(--ink2); border:1px solid var(--line); border-radius:var(--r2);
  padding:18px 22px; margin-bottom:10px;
}
.skel-line {
  height:12px; border-radius:6px; margin-bottom:8px;
  background:linear-gradient(90deg, var(--ink3) 25%, var(--ink4) 50%, var(--ink3) 75%);
  background-size:200% 100%;
  animation:skel-shimmer 1.4s ease-in-out infinite;
}
.skel-line:last-child{margin-bottom:0}
@media (prefers-reduced-motion: reduce){ .skel-line{ animation:none; } }

/* ══ RICH EDITOR TOOLBAR ══════════════════════════════ */
.rich-toolbar {
  display:flex; flex-wrap:wrap; gap:3px;
  background:var(--ink3); border:1px solid var(--line2);
  border-radius:10px 10px 0 0; padding:6px 8px;
  border-bottom:none;
}
.rich-toolbar button {
  background:var(--ink2); border:1px solid var(--line2);
  border-radius:6px; padding:4px 8px; cursor:pointer;
  font-size:13px; color:var(--ice2); font-family:'Sora',sans-serif;
  transition:all 0.15s; min-width:28px; height:28px;
  display:flex;align-items:center;justify-content:center;
}
.rich-toolbar button:hover { background:var(--gold-bg); border-color:var(--gold-line); color:var(--gold); }
.rich-toolbar .sep { width:1px; background:var(--line2); margin:2px 3px; align-self:stretch; }
.rich-editor {
  border-radius:0 0 10px 10px !important;
  border-top:none !important;
  min-height:160px;
  font-family:'Sora',sans-serif;
  font-size:14px;
  line-height:1.7;
}

    arts.forEach(function (a) { var s = scoreTxt(tk, a.txt) + (a.isNew ? 0.1 : 0); if (s > bs) { bs = s; best = a; } });
    if (!best || bs < 1) return { a: 'לא מצאתי בבסיס הידע תשובה מדויקת לשאלה הזו.\nהעברתי אותה למנהל כ"שאלה ללא מענה", כדי שיוסיף לבסיס הידע מסמך שעונה עליה. ✓', src: null };
    if (best.isNew) {
      var ss = S.b.content.split(/[.!?\n]+/).map(function (x) { return x.trim(); }).filter(function (x) { return x.length > 2; });
      var top = ss.map(function (s) { return { s: s, v: scoreTxt(tk, s) }; }).sort(function (x, y) { return y.v - x.v; });
      var pick = top.filter(function (x) { return x.v > 0; }).slice(0, 2).map(function (x) { return x.s + '.'; });
      if (!pick.length) pick = [ss[0] + '.'];
      return { a: 'לפי התדריך העדכני:\n' + pick.join('\n'), src: best.t + ' · עודכן היום' };
    }
    return { a: best.ans, src: best.t + ' · ' + best.f };
  }
  function openChat() {
    pulse(null);
    var sug = S.b.sample ? ['כמה ימים יש ללקוח להחזיר מוצר?', 'מה עושים במוצר פגום?', 'מה שעות הפעילות של המוקד?', 'איך מקפיאים מנוי?'] : ['מה השתנה בתדריך החדש?', 'מה שעות הפעילות של המוקד?', 'איך מקפיאים מנוי?', 'איך מאמתים זהות לקוח?'];
    $('ov').innerHTML = '<div class="box"><div class="bh"><div><b>🧠 שאל את ה-AI</b><small>עונה מתוך בסיס הידע של המחלקה שלך</small></div><button id="chX">✕</button></div><div class="chat" id="chat"><div class="msg a">היי ' + esc(S.agent.n.split(' ')[0]) + ' 👋\nשאלו אותי כל שאלה על הנהלים, ואענה מתוך בסיס הידע.</div></div>' +
      '<div class="sugg">' + sug.map(function (s) { return '<button data-s="' + esc(s) + '">' + esc(s) + '</button>'; }).join('') + '</div><div class="chat-in"><input type="text" id="chIn" placeholder="הקלידו שאלה..."><button class="btn btn-gold btn-sm" id="chGo">שלח</button></div></div>';
    $('ov').classList.add('on');
    $('chX').onclick = closeChat;
    $('ov').querySelectorAll('[data-s]').forEach(function (b) { b.onclick = function () { $('chIn').value = b.getAttribute('data-s'); send(); }; });
    $('chGo').onclick = send; $('chIn').onkeydown = function (e) { if (e.key === 'Enter') send(); };
    if (S.step === 7 && !S.asked) later(function () { pulse($('chIn'), '✍️ הקלידו שאלה, או בחרו שאלה מוכנה'); }, 200);
  }
  function send() {
    var q = $('chIn').value.trim(); if (!q) { toast('הקלידו שאלה'); return; }
    var ch = $('chat'); ch.insertAdjacentHTML('beforeend', '<div class="msg u">' + esc(q) + '</div><div class="msg a" id="typing"><span class="loading"><i></i><i></i><i></i> מחפש בבסיס הידע...</span></div>');
    $('chIn').value = ''; ch.scrollTop = ch.scrollHeight; pulse(null);
    later(function () {
      var r = answerQ(q); var t = $('typing'); t.removeAttribute('id');
      t.innerHTML = esc(r.a) + (r.src ? '<span class="src">📚 מקור: ' + esc(r.src) + '</span>' : '');
      ch.scrollTop = ch.scrollHeight;
      S.lastQ = q;
      if (S.step === 7 && !S.asked) { S.asked = true; S.askedQ = q; later(function () { nextBtn('לדשבורד המנהל ←', function () { closeChat(); navTo('dash'); }); pulse($('chX'), 'אפשר לשאול עוד, או לסגור ולעבור למנהל'); }, 500); }
    }, 1000);
  }
  function closeChat() { $('ov').classList.remove('on'); pulse(null); if (S.step === 7 && S.asked && S.view === 'a-home') later(function () { pulse($('navMgr'), '👇 עוברים לעולם הניהול'); }, 200); }

  /* ---------- manager dashboard ---------- */
  function results() {
    var r = [];
    AGENTS.forEach(function (a) {
      var inT = S.b.depts.indexOf(a.d) > -1; if (!inT) return;
      var sc = S.agent && a.id === S.agent.id ? S.score : OTHERS[a.id];
      if (S.agent && a.id === S.agent.id && !S.signed) sc = null;
      r.push({ a: a, s: sc, me: S.agent && a.id === S.agent.id });
    });
    if (S.agent && S.b.depts.indexOf(S.agent.d) < 0) r.push({ a: S.agent, s: S.score, me: true });
    return r;
  }
  VIEWS.dash = function () {
    var R = results(), done = R.filter(function (x) { return x.s != null; }), pend = R.filter(function (x) { return x.s == null; });
    var pct = R.length ? Math.round(done.length / R.length * 100) : 0;
    var avg = done.length ? Math.round(done.reduce(function (s, x) { return s + x.s; }, 0) / done.length) : 0;
    // weak question: one the user got wrong, else question 2
    var wi = 1; S.b.qs.forEach(function (q, i) { if (S.answers[i] !== undefined && S.answers[i] !== q.c) wi = i; });
    var wq = S.b.qs[wi] || S.b.qs[0];
    var C = 2 * Math.PI * 46, off = C * (1 - pct / 100);
    var h = '<div style="display:flex;gap:20px;align-items:flex-start"><div class="dsb"><button class="on" data-go="top">🏠 דשבורד ראשי</button><button data-go="cStatus">🟢 סטטוס חי</button><button data-go="cScores">📊 ציונים</button><button data-go="cLb">🏆 לוח תחרות</button><button data-go="cStatus">⏳ ממתינים</button><button data-go="cWeak">⚠️ שאלות בעייתיות</button><button data-go="cFb">💬 משובי עובדים</button></div><div style="flex:1;min-width:0">';
    h += '<div class="sec-header" style="margin-bottom:1.3rem"><div class="between" style="align-items:flex-start;flex-wrap:wrap;gap:12px"><div><div class="sec-eyebrow">Analytics Dashboard</div><div class="sec-title">דשבורד <em>מעקב</em></div></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-outline btn-sm" id="pdfBtn">📄 הורד דוח PDF</button><button class="btn btn-sm" id="waBtn" style="background:#25D366;color:#fff;border:0">📲 שלח ל-WhatsApp</button></div></div></div>';
    h += '<div class="dash-g">' +
      '<div class="dc alertc"><h3><span>⚠️ דורש טיפול</span><span class="pill new">High Priority</span></h3><div class="big">' + pend.length + '</div><div style="font-size:12.5px;color:#8E1F1A;margin-bottom:8px">עובדים עוד לא השלימו את התדריך החדש</div>' + pend.map(function (x) { return '<div class="row"><span>' + x.a.n + '</span><span style="color:var(--ice3)">' + x.a.d + '</span></div>'; }).join('') + (pend.length ? '<button class="btn btn-outline btn-sm" id="remindBtn" style="margin-top:8px">🔔 שלח תזכורת</button>' : '') + '</div>' +
      '<div class="dc" id="cStatus"><h3>התדריך החדש</h3><div style="font-size:12px;color:var(--ice3);margin-top:-6px;margin-bottom:4px">' + esc(S.b.title) + '</div><svg class="ring" viewBox="0 0 110 110"><circle cx="55" cy="55" r="46" fill="none" stroke="#E5DFF5" stroke-width="10"/><circle cx="55" cy="55" r="46" fill="none" stroke="#7469A6" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 55 55)"/><text x="55" y="61" text-anchor="middle" font-size="22" font-weight="800" fill="#241F3D" font-family="Outfit,sans-serif">' + pct + '%</text></svg><div class="row"><span>השלימו</span><b>' + done.length + ' / ' + R.length + '</b></div><div class="row"><span>ציון ממוצע</span><b>' + avg + '%</b></div></div>' +
      '<div class="dc" id="cWeak"><h3>⚠️ שאלה לתשומת לב</h3><div style="font-size:13px;font-weight:700;color:var(--ice);margin-bottom:6px">' + esc(wq.q) + '</div><div class="row"><span>טעו בה</span><b style="color:var(--danger)">' + (S.answers[wi] !== undefined && S.answers[wi] !== wq.c ? '43%' : '29%') + '</b></div><div class="row"><span>התשובה הנכונה</span><b>' + esc(wq.o[wq.c]) + '</b></div><div style="font-size:11.5px;color:var(--ice3);margin-top:6px">כדאי לחדד את הנקודה הזו בתדריך הבא או בישיבת צוות.</div></div>' +
      '</div>';
    h += '<div class="dash-g" style="grid-template-columns:1.3fr 1fr">' +
      '<div class="dc" id="cScores"><h3>ציונים בתדריך החדש</h3>' + R.map(function (x) { return '<div class="row' + (x.me ? '" style="background:#FFF8E1;border-radius:8px;padding:5px 8px' : '') + '"><span style="width:110px;flex-shrink:0">' + x.a.n + (x.me ? ' (אתם)' : '') + '</span><div class="barx"><i style="width:' + (x.s || 0) + '%' + (x.s != null && x.s < 60 ? ';background:var(--danger)' : '') + '"></i></div><b style="width:44px;text-align:left">' + (x.s == null ? '—' : x.s + '%') + '</b></div>'; }).join('') + '</div>' +
      '<div class="dc" id="cFb"><h3>💬 משובי עובדים</h3>' + (S.fb ? '<div class="bcard" style="background:#FFF8E1"><div><b>' + esc(S.agent.n) + ' (אתם)</b><small>' + esc(S.fb) + '</small></div></div>' : '') + '<div class="bcard"><div><b>שירן מימון</b><small>ברור מאוד, תודה. אפשר להוסיף דוגמה לשיחה?</small></div></div><div class="bcard"><div><b>הדר פרץ</b><small>הסיכום ב-AI עזר לי לפני המבחן 👍</small></div></div>' + (S.askedQ ? '<div style="font-size:11.5px;color:var(--ice3);margin-top:6px">שאלה אחרונה ל-AI: "' + esc(S.askedQ) + '"</div>' : '') + '</div></div>';
    var pts = {}; AGENTS.forEach(function (a) { pts[a.id] = POINTS[a.id] + (S.signed && S.agent && a.id === S.agent.id ? S.score : 0); });
    var lb = AGENTS.slice().sort(function (x, y) { return pts[y.id] - pts[x.id]; });
    h += '<div class="dc" id="cLb"><h3>🏆 לוח תחרות</h3><table class="lb"><thead><tr><th>#</th><th>עובד</th><th>מחלקה</th><th>נקודות</th></tr></thead><tbody>' + lb.map(function (a, i) { var me = S.agent && a.id === S.agent.id; return '<tr' + (me ? ' class="me"' : '') + '><td>' + (i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1) + '</td><td><b>' + a.n + '</b>' + (me ? ' (אתם)' : '') + '</td><td>' + a.d + '</td><td>' + pts[a.id] + '</td></tr>'; }).join('') + '</tbody></table></div>';
    h += '</div></div>';
    A.innerHTML = h;
    document.querySelectorAll('[data-go]').forEach(function (b) { b.onclick = function () { var id = b.getAttribute('data-go'); if (id === 'top') scrollTo({ top: 0, behavior: 'smooth' }); else $(id).scrollIntoView({ behavior: 'smooth', block: 'center' }); }; });
    $('pdfBtn').onclick = openReport;
    $('waBtn').onclick = sendWa;
    if ($('remindBtn')) $('remindBtn').onclick = function () { showPush('📚', 'LearnIx', 'תזכורת: התדריך "' + S.b.title + '" עדיין מחכה לך'); toast('✓ נשלחה תזכורת ל-' + pend.length + ' עובדים'); };
  };
  function dashHints() { if (S.step === 8 && !S.reportDone) later(function () { pulse($('pdfBtn'), '👇 נסו להוציא דוח למנהלים'); }, 400); }
  function reportDone() { if (S.step === 8 && !S.reportDone) { S.reportDone = true; nextBtn('סיום ←', function () { go(9); }); later(function () { pulse(document.querySelector('#tour .tbtn.gold'), '👈 לסיום ההדגמה'); }, 300); } }
  function openReport() {
    var R = results(), done = R.filter(function (x) { return x.s != null; });
    $('ov').innerHTML = '<div class="box" id="report"><div class="bh"><div><b>📄 דוח תדריכים</b><small>' + TODAY + ' · כל המחלקות</small></div><button id="rpX">✕</button></div><div class="report"><h2>' + esc(S.b.title) + '</h2><div style="color:var(--ice3);margin-bottom:12px">פורסם היום ל-' + R.length + ' עובדים · השלימו ' + done.length + ' · ציון ממוצע ' + (done.length ? Math.round(done.reduce(function (s, x) { return s + x.s; }, 0) / done.length) : 0) + '%</div>' +
      '<table class="lb"><thead><tr><th>עובד</th><th>מחלקה</th><th>ציון</th><th>חתימה</th></tr></thead><tbody>' + R.map(function (x) { return '<tr' + (x.me ? ' class="me"' : '') + '><td>' + x.a.n + '</td><td>' + x.a.d + '</td><td>' + (x.s == null ? '—' : x.s + '%') + '</td><td>' + (x.s == null ? '<span class="pill new">ממתין</span>' : '<span class="pill ok">✓ ' + TODAY + '</span>') + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div style="padding:12px 18px;border-top:1px solid var(--line2);display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-gold btn-sm" id="printBtn">🖨️ הדפסה / שמירה כ-PDF</button><button class="btn btn-outline btn-sm" id="rpClose">סגור</button></div></div>';
    $('ov').classList.add('on');
    var close = function () { $('ov').classList.remove('on'); reportDone(); };
    $('rpX').onclick = close; $('rpClose').onclick = close;
    $('printBtn').onclick = function () { try { window.print(); } catch (e) { } };
    if (S.step === 8) later(function () { pulse($('rpClose'), 'כך נראה הדוח. סגרו כשתסיימו'); }, 300);
  }
  function sendWa() {
    var R = results(), done = R.filter(function (x) { return x.s != null; }), pend = R.filter(function (x) { return x.s == null; });
    var txt = '📊 *דוח LearnIx יומי*\n' + TODAY + '\n\n📄 ' + S.b.title + '\n✅ השלימו: ' + done.length + '/' + R.length + '\n⭐ ציון ממוצע: ' + (done.length ? Math.round(done.reduce(function (s, x) { return s + x.s; }, 0) / done.length) : 0) + '%\n⏳ ממתינים: ' + (pend.map(function (x) { return x.a.n; }).join(', ') || 'אין') + '\n\n⚠️ שאלה לחידוד: ' + (S.b.qs[1] || S.b.qs[0]).q;
    $('phone').innerHTML = '<div class="phone"><div class="scr"><div class="hd"><div class="av">LX</div><div><b>LearnIx · דוחות</b><small>הודעה למנהל המוקד</small></div></div><div class="bd"><div class="wmsg">' + esc(txt).replace(/\*([^*]+)\*/g, '<b>$1</b>') + '</div></div></div><button class="x" id="phX">סגירה</button></div>';
    $('phone').classList.add('on');
    $('phX').onclick = function () { $('phone').classList.remove('on'); reportDone(); };
    pulse(null);
  }

  /* boot */
  renderTour(); renderNav(); VIEWS.login();
  later(function () { pulse($('mgrGo'), '👇 לחצו כאן כדי להיכנס'); }, 400);
})();
</script>
