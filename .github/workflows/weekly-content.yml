name: Blog draft (Sun/Tue/Thu)

on:
  schedule:
    # Sunday, Tuesday, Thursday ~06:00 Israel time (03:00 UTC, ignoring DST drift)
    - cron: "0 3 * * 0,2,4"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install script dependencies
        working-directory: scripts/weekly-content
        run: npm install --no-save

      - name: Generate draft post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/weekly-content/generate.mjs

      - name: Read summary
        id: summary
        run: |
          IFS='|' read -r SLUG TITLE PRODUCT < .weekly-post-summary || true
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
          rm .weekly-post-summary

      - name: Commit and push draft branch
        env:
          SLUG: ${{ steps.summary.outputs.slug }}
          TITLE: ${{ steps.summary.outputs.title }}
        run: |
          git config user.name "al-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "auto/post-$SLUG"
          git add blog.html sitemap.xml "blog/$SLUG.html"
          git commit -m "Auto-draft: $TITLE"
          git push origin "auto/post-$SLUG"

      - name: Open PR against preview
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.summary.outputs.slug }}
          TITLE: ${{ steps.summary.outputs.title }}
          PRODUCT: ${{ steps.summary.outputs.product }}
        run: |
          PR_URL=$(gh pr create \
            --base preview \
            --head "auto/post-$SLUG" \
            --title "Auto-draft ($PRODUCT): $TITLE" \
            --body "Weekly auto-generated draft based on Search Console query data. Review the diff, check the preview link once merged into preview, and merge this PR only if it reads well. Nothing here ever reaches main without a manual merge from you.")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Notify WhatsApp
        env:
          EXTERNAL_SEND_SECRET: ${{ secrets.EXTERNAL_SEND_SECRET }}
          NOTIFY_PHONE: ${{ vars.NOTIFY_PHONE }}
          TITLE: ${{ steps.summary.outputs.title }}
          PRODUCT: ${{ steps.summary.outputs.product }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          MESSAGE=$(printf '%s\n%s' "פוסט חדש ממתין לאישור ($PRODUCT): $TITLE" "$PR_URL")
          curl -sS -X POST "https://whatsapp-bot-production-120a.up.railway.app/api/external-send" \
            -H "Authorization: Bearer $EXTERNAL_SEND_SECRET" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg phone "$NOTIFY_PHONE" --arg message "$MESSAGE" --arg source "al-systems weekly-content" '{phone:$phone, message:$message, source:$source}')" \
            || echo "WhatsApp notification failed (non-fatal)"
