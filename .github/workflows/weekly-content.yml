name: Blog draft (Sun/Tue/Thu)

on:
  schedule:
    # Sunday, Tuesday, Thursday ~10:00 Israel time (07:00 UTC, ignoring DST drift)
    - cron: "0 7 * * 0,2,4"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install script dependencies
        working-directory: scripts/weekly-content
        run: npm install --no-save

      - name: Install OG image dependencies
        working-directory: scripts/og-images
        run: npm install --no-save

      - name: Generate draft post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/weekly-content/generate.mjs

      - name: Read summary
        id: summary
        if: always()
        run: |
          if [ ! -f .weekly-post-summary ]; then
            echo "No summary file — script likely crashed before writing one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=הסקריפט נכשל לפני שסיים לרשום סיכום (כנראה שגיאה לא צפויה - כדאי לבדוק את הלוג)." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SKIP=$(jq -r '.skip' .weekly-post-summary)
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r '.reason // "לא צוינה סיבה"' .weekly-post-summary)" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" != "true" ]; then
            echo "slug=$(jq -r '.slug' .weekly-post-summary)" >> "$GITHUB_OUTPUT"
            echo "title=$(jq -r '.title' .weekly-post-summary)" >> "$GITHUB_OUTPUT"
            echo "product=$(jq -r '.product' .weekly-post-summary)" >> "$GITHUB_OUTPUT"
            echo "target_query=$(jq -r '.targetQuery' .weekly-post-summary)" >> "$GITHUB_OUTPUT"
          fi
          rm .weekly-post-summary

      - name: Generate OG share image
        if: steps.summary.outputs.skip != 'true'
        run: node scripts/og-images/generate.mjs

      - name: Rebuild RSS feed
        if: steps.summary.outputs.skip != 'true'
        run: node scripts/rss/generate.mjs

      - name: Commit and push draft branch
        if: steps.summary.outputs.skip != 'true'
        env:
          SLUG: ${{ steps.summary.outputs.slug }}
          TITLE: ${{ steps.summary.outputs.title }}
        run: |
          git config user.name "al-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "auto/post-$SLUG"
          git add blog.html sitemap.xml rss.xml "blog/$SLUG.html" "assets/og/blog-$SLUG.png"
          git commit -m "Auto-draft: $TITLE"
          git push origin "auto/post-$SLUG"

      - name: Open PR against preview
        if: steps.summary.outputs.skip != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.summary.outputs.slug }}
          TITLE: ${{ steps.summary.outputs.title }}
          PRODUCT: ${{ steps.summary.outputs.product }}
          TARGET_QUERY: ${{ steps.summary.outputs.target_query }}
          REASON: ${{ steps.summary.outputs.reason }}
        run: |
          BODY=$(printf '%s\n\n%s\n%s\n\n%s\n%s\n\n%s' \
            "שאילתת היעד: \"$TARGET_QUERY\"" \
            "למה:" "$REASON" \
            "טיוטה שבועית אוטומטית מבוססת על נתוני Search Console והשלמה אוטומטית של גוגל." \
            "900+ מילים, עם טבלת השוואה ושאלות נפוצות לפי המבנה הקבוע." \
            "תבדקו את ה-diff, בדקו את קישור התצוגה המקדימה אחרי מיזוג ל-preview, ומזגו רק אם זה קורא טוב.")
          PR_URL=$(gh pr create \
            --base preview \
            --head "auto/post-$SLUG" \
            --title "Auto-draft ($PRODUCT): $TITLE" \
            --body "$BODY")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Notify WhatsApp
        if: steps.summary.outputs.skip != 'true'
        env:
          EXTERNAL_SEND_SECRET: ${{ secrets.EXTERNAL_SEND_SECRET }}
          NOTIFY_PHONE: ${{ vars.NOTIFY_PHONE }}
          TITLE: ${{ steps.summary.outputs.title }}
          PRODUCT: ${{ steps.summary.outputs.product }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          MESSAGE=$(printf '%s\n%s' "פוסט חדש ממתין לאישור ($PRODUCT): $TITLE" "$PR_URL")
          curl -sS -X POST "https://whatsapp-bot-production-120a.up.railway.app/api/external-send" \
            -H "Authorization: Bearer $EXTERNAL_SEND_SECRET" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg phone "$NOTIFY_PHONE" --arg message "$MESSAGE" --arg source "al-systems weekly-content" '{phone:$phone, message:$message, source:$source}')" \
            || echo "WhatsApp notification failed (non-fatal)"

      - name: Notify WhatsApp (no post this run)
        if: always() && steps.summary.outputs.skip == 'true'
        env:
          EXTERNAL_SEND_SECRET: ${{ secrets.EXTERNAL_SEND_SECRET }}
          NOTIFY_PHONE: ${{ vars.NOTIFY_PHONE }}
          REASON: ${{ steps.summary.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE=$(printf '%s\n%s\n\n%s' "⚠️ הריצה היום של הבוט לא העלתה פוסט חדש" "$REASON" "$RUN_URL")
          curl -sS -X POST "https://whatsapp-bot-production-120a.up.railway.app/api/external-send" \
            -H "Authorization: Bearer $EXTERNAL_SEND_SECRET" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg phone "$NOTIFY_PHONE" --arg message "$MESSAGE" --arg source "al-systems weekly-content" '{phone:$phone, message:$message, source:$source}')" \
            || echo "WhatsApp notification failed (non-fatal)"
