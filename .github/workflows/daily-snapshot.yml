name: Daily SEO status snapshot

on:
  schedule:
    # 05:00 Israel time (02:00 UTC, ignoring DST drift)
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install script dependencies
        working-directory: scripts/weekly-content
        run: npm install --no-save

      - name: Generate and commit SEO status snapshot
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          node scripts/weekly-content/snapshot.mjs
          git config user.name "al-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seo-status.json
          git diff --cached --quiet || git commit -m "Update SEO status snapshot"
          git push origin main
