name: IndexNow ping

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for GitHub Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 18); do
            STATUS=$(gh api repos/${{ github.repository }}/pages/builds/latest --jq '.status' 2>/dev/null || echo "")
            echo "pages build status: $STATUS"
            if [ "$STATUS" = "built" ]; then break; fi
            sleep 10
          done

      - name: Build changed-URL list and ping IndexNow
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- '*.html' || true)
          URLS="[]"
          for f in $CHANGED; do
            if [ "$f" = "index.html" ]; then
              URL="https://al-systems.co.il/"
            else
              URL="https://al-systems.co.il/$f"
            fi
            if ! grep -qF "<loc>$URL</loc>" sitemap.xml; then
              continue
            fi
            URLS=$(echo "$URLS" | jq --arg u "$URL" '. + [$u]')
          done

          COUNT=$(echo "$URLS" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "No public page changes to report."
            exit 0
          fi

          echo "Pinging IndexNow for:"
          echo "$URLS" | jq -r '.[]'

          jq -n \
            --arg host "al-systems.co.il" \
            --arg key "0e63b840779b2ecc339919e1310a3cb4" \
            --arg keyLocation "https://al-systems.co.il/0e63b840779b2ecc339919e1310a3cb4.txt" \
            --argjson urlList "$URLS" \
            '{host:$host, key:$key, keyLocation:$keyLocation, urlList:$urlList}' \
          | curl -sS -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d @- \
          || echo "IndexNow ping failed (non-fatal)"
